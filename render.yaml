services:
  - type: web
    name: site-data-analysis-2
    env: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: APP_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.3
